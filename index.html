<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KilVerse — Jour J</title>
<style>
:root{color-scheme:dark;--bg:#090512;--panel:#1a0c2b;--purple:#bd4dff;--pink:#f0a5ff;--text:#fff7ff;--muted:#d3b8e8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#4b176e 0%,#1c0b30 38%,#07040d 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);overflow-x:hidden}
main{position:relative;width:min(100%,1100px);text-align:center;padding:clamp(20px,4vw,48px);border:1px solid #bd4dff66;border-radius:28px;background:linear-gradient(145deg,#150920eF,#090512f5);box-shadow:0 0 70px #9b2dce25,inset 0 0 45px #7e22ce12;overflow:hidden}
main:before,main:after{content:"🌸　✿　🌸　✧　🌸";position:absolute;top:10px;color:#e879f9;font-size:clamp(1rem,3vw,2rem);opacity:.8;letter-spacing:.3em;pointer-events:none}
main:before{left:10px}main:after{right:10px;transform:scaleX(-1)}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;color:#e9b8ff;font-weight:800;font-size:.8rem;margin-top:22px}
h1{font-size:clamp(3rem,9vw,7rem);line-height:.95;margin:16px 0;color:#d98aff;text-shadow:0 0 12px #bd4dff,0 0 42px #a21caf88;font-weight:1000;letter-spacing:.04em}
.flames{font-size:clamp(1.4rem,3vw,2.4rem);letter-spacing:.35em;filter:drop-shadow(0 0 10px #c026ff);margin:12px 0}
.subtitle{color:var(--muted);font-size:clamp(1rem,2vw,1.25rem);margin-bottom:32px}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,18px)}
.unit{padding:clamp(14px,3vw,28px) 6px;border:1px solid #d879ff99;border-radius:20px;background:linear-gradient(145deg,#32164bea,#150a24f5);box-shadow:0 0 22px #a21caf28,inset 0 1px #fff2}
.number{font-variant-numeric:tabular-nums;font-size:clamp(2.2rem,8vw,6.5rem);font-weight:950;line-height:1;letter-spacing:-.05em;color:#fff;text-shadow:0 0 18px #d879ffbb}
.label{margin-top:12px;font-size:clamp(.62rem,1.5vw,.95rem);letter-spacing:.15em;color:#e9b8ff;font-weight:850}
footer{margin-top:26px;color:#d3b8e8;font-size:.95rem}.sakura{font-size:1.2rem;color:#f0a5ff;letter-spacing:.4em;margin-top:18px}
@media(max-width:560px){main{padding:22px 14px}.timer{grid-template-columns:repeat(2,minmax(0,1fr))}.unit{border-radius:15px}.subtitle{margin-bottom:22px}main:before,main:after{font-size:.9rem}}


body {
  background-image: url("file:///C:/Users/Lamboley/Desktop/SKIN%20MINECRAFT%20IMPORTANT/V4.png") !important;
  background-size: cover !important;
  background-position: center !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
}


</style>
</head>
<body>
<main>
  <div class="eyebrow">🔥 ✦ Bienvenue dans notre univers ✦ 🔥</div>
  <h1>KilVerse</h1>
  <div class="flames">🔥 💜 🌸 💜 🔥</div>
  <div class="subtitle">Compte à rebours jusqu’au 1er novembre 2026 à minuit · Heure de Paris</div>
  <section class="timer" aria-label="Temps restant">
    <div class="unit"><div class="number" id="days">--</div><div class="label">JOURS</div></div>
    <div class="unit"><div class="number" id="hours">--</div><div class="label">HEURES</div></div>
    <div class="unit"><div class="number" id="minutes">--</div><div class="label">MINUTES</div></div>
    <div class="unit"><div class="number" id="seconds">--</div><div class="label">SECONDES</div></div>
  </section>
  <div class="sakura">🌸 ✧ 🌸 ✧ 🌸</div>
  <footer id="status">Les flammes violettes de KilVerse veillent sur le Jour J 💜</footer>
</main>
<script>
const target = new Date("2026-11-01T00:00:00+01:00").getTime();
const pad = n => String(n).padStart(2,"0");
function update(){
  let diff = target - Date.now();
  if(diff <= 0){
    ["days","hours","minutes","seconds"].forEach(id=>document.getElementById(id).textContent="00");
    document.getElementById("status").textContent="C’est le Jour J ! Bienvenue au grand rendez-vous KilVerse 💜";
    return;
  }
  const days=Math.floor(diff/86400000); diff%=86400000;
  const hours=Math.floor(diff/3600000); diff%=3600000;
  const minutes=Math.floor(diff/60000); diff%=60000;
  const seconds=Math.floor(diff/1000);
  document.getElementById("days").textContent=days;
  document.getElementById("hours").textContent=pad(hours);
  document.getElementById("minutes").textContent=pad(minutes);
  document.getElementById("seconds").textContent=pad(seconds);
}
update(); setInterval(update,1000);
</script>
</body>
</html>
